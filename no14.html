<!DOCTYPE html>
<html>
<head>
<title>Animated Letter</title>
<style>
body {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
  background-color: #f0f0f0;
}

#letter {
  font-size: 5em;
  opacity: 0;
  position: relative;
  transition: opacity 1s, top 1s;
}

button {
  padding: 15px 30px;
  font-size: 16px;
  cursor: pointer;
  background-color: lightyellow;
  border: 1px solid #ddd;
  border-radius: 5px;
  margin-top: 20px;
}
</style>
</head>
<body>

<button onclick="animateLetter()">Show Letter</button>

<div id="letter">A</div>

<audio id="music" src="iraady.mp3"></audio>

<button onclick="location.href='new.html'">Next Page</button>

<script>
function animateLetter() {
  const letter = document.getElementById('letter');
  const music = document.getElementById('music');

  letter.style.opacity = 1;
  letter.style.top = '-100px'; // Move the letter from above

  music.play();
}
</script>

</body>
</html>

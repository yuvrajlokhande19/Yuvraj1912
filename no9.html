<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greeting Card</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Caveat', cursive;
        }

        .card-container {
            perspective: 1500px;
            width: 95%;
            max-width: 800px;
            height: auto;
            transform: rotate(-3deg);
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 1.2s;
            transform-style: preserve-3d;
        }

        .card.flipped {
            transform: rotateY(-180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            backface-visibility: hidden;
            border-radius: 10px;
            border: 3px solid #d3d3d3;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            background-color: #ffe4e1;
        }

        .card-front {
            background-color: #ffe4e1;
            color: #ff69b4;
            font-size: 1.8em;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .heart-emoji {
            font-size: 3em;
            margin-bottom: 10px;
            animation: heartbeat 1.5s infinite;
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            25% { transform: scale(1.1); }
            50% { transform: scale(1); }
            75% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .press-me-text {
            font-size: 1.2em;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .card-back {
            transform: rotateY(180deg);
            display: flex;
            flex-direction: row;
            background-color: #ffe4e1;
            border-radius: 10px;
            overflow: hidden;
            border-left: 1px dotted black;
        }

        .page {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            border: 2px solid #d3d3d3;
            border-radius: 0px;
            background-color: #f5b7b1;
            overflow: auto;
            margin: 0;
            border-right: 1px dotted black;
        }

        .page:last-child {
            border-right: none;
        }

        .left-page {
        }

        .right-page {
        }

        .wishes-content {
            font-size: 1.2em;
            color: #ffdb58;
            font-weight: bold;
            text-align: center;
            line-height: 1.4;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2);
        }

        .image-container {
            width: 90%;
            height: auto;
            max-height: 90%;
            border: 4px solid #8b4513;
            border-radius: 10px;
            outline: 2px dashed #d3d3d3;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            margin: auto;
        }

        .image-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        #nextButton {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #ffb6c1;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            transition: background-color 0.3s ease;
            position: fixed;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 300px;
        }

        #nextButton:hover {
            background-color: #ffa07a;
        }

        @media (max-width: 480px) {
            html, body {
                overflow-x: hidden;
                width: 100%;
            }

            body {
                position: relative;
            }

            .card-container {
                width: 98%;
                transform: rotate(0);
            }

            .card {
                width: 100%;
                 height: auto;
            }

            .card-face {
                width: 100%;
                height: auto;
            }

            .card-front {
                font-size: 1.4em;
                 padding: 20px;
            }

            .heart-emoji {
                font-size: 2.5em;
            }

            .press-me-text {
                font-size: 1em;
            }

            .card-back {
                flex-direction: column;
                border-left: 1px dotted black;
                 width: 100%;
                 height: auto;
            }

            .page {
                width: 100%;
                margin: 10px 0;
                padding: 10px;
                border-left: none;
                border-right: none;
                border-bottom: 1px dotted black;
                 height: auto;
            }

            .page:last-child {
                border-bottom: none;
            }

            .left-page, .right-page {
                margin: 0;
                border-bottom:  1px dotted black;
                 width: 100%;
                 height: auto;
            }
           .image-container{
             width: 95%;
             height: auto;
           }

            .wishes-content {
                font-size: 1.1em;
            }

            .image-container {
                width: 95%;
                max-height: 95%;
            }

            #nextButton {
                width: 90%;
                max-width: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="card-container">
        <div class="card" id="myCard">
            <div class="card-face card-front" id="cardFront">
                <div class="heart-emoji">💖</div>
                <div class="press-me-text">Touch Me</div>
            </div>
            <div class="card-face card-back">
                <div class="page left-page">
                    <div class="wishes-content">
                        <p>Happy Birthday!</p>
                        <p>May your day be filled with love and joy.</p>
                        <p>Wishing you all the best!</p>
                    </div>
                </div>
                <div class="page right-page">
                    <div class="image-container">
                        <img src="pexels-rok-romih-1746122-3489072.jpg" alt="Birthday Image">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <button id="nextButton">Next</button>

    <audio id="birthdaySong" src="iraady.mp3"></audio>

    <script>
        const card = document.getElementById('myCard');
        const cardFront = document.getElementById('cardFront');
        const birthdaySong = document.getElementById('birthdaySong');
        const nextButton = document.getElementById('nextButton');

        cardFront.addEventListener('click', () => {
            card.classList.add('flipped');
            birthdaySong.play();
        });

        nextButton.addEventListener('click', () => {
            window.location.href = "new.html";
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Handwriting</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding-top: 70px;
            position: relative;
        }

        #notebookPage {
            background-image: linear-gradient(to bottom, transparent 0%, transparent 8%, #ddd 8%, #ddd 92%, transparent 92%, transparent 100%);
            background-size: 100% 25px;
            width: 90%;
            max-width: 800px;
            min-height: 400px;
            margin-bottom: 80px;
            padding: 20px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 10px;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.1);
            font-family: 'Caveat', cursive;
            font-size: 1.2em;
            line-height: 1.5;
            color: #00008b;
            resize: none;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            pointer-events: none;
        }

        #notebookPage:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 5px rgba(0, 123, 255, 0.5);
        }

        .audio-button {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #fff;
            border: 2px solid #007bff;
            border-radius: 25px;
            padding: 10px 15px;
            padding-left: 30px;
            padding-right: 30px;
            cursor: pointer;
            font-size: 1em;
            color: #007bff;
            transition: background-color 0.3s ease, color 0.3s ease;
            z-index: 1001;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .audio-button:hover {
            background-color: #007bff;
            color: white;
        }

        .audio-button.playing {
            background-color: #007bff;
            color: white;
        }

        #yesButton {
            padding: 12px 25px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            font-weight: 700;
            font-size: 1.1em;
            transition: background-color 0.3s ease;
            width: 150px;
            text-align: center;
        }

        #yesButton:hover {
            background-color: #0056b3;
        }

        .icon {
            width: 20px;
            height: 20px;
            background-size: contain;
            background-repeat: no-repeat;
            display: inline-block;
        }

        .play-icon {
        }

        .pause-icon {
        }

    </style>
</head>
<body>

    <button id="audioButton" class="audio-button">
        <span class="icon play-icon">&#x25B6;</span> <span id="audioButtonText">Play Music</span>
    </button>

    <textarea id="notebookPage">Hey, you know, I just wanted to tell you how much I like you.
        You're really pretty, and I think you're cute too. It makes me happy just looking at you. 
        You always seem to know how to make me smile, and I love how you make me feel. I'm so lucky to have you in my life,
        and I hope we can have lots of fun together. You're special, and I'm glad we met.
</textarea>

    <button id="yesButton">Yes</button>

    <script>
        const notebookPage = document.getElementById('notebookPage');
        const audioButton = document.getElementById('audioButton');
        const audioButtonText = document.getElementById('audioButtonText');
        const yesButton = document.getElementById('yesButton');

        let audio = new Audio('kabhi-kabhi.mp3'); // Add your music file path here
        let isPlaying = false;

        // Auto-resize textarea
        notebookPage.addEventListener('input', () => {
            notebookPage.style.height = 'auto';
            notebookPage.style.height = `${notebookPage.scrollHeight}px`;
        });

        window.addEventListener('load', () => {
            notebookPage.style.height = 'auto';
            notebookPage.style.height = `${notebookPage.scrollHeight}px`;
        });

        audioButton.addEventListener('click', () => {
            if (isPlaying) {
                audio.pause();
                isPlaying = false;
                audioButtonText.textContent = 'Play Music';
                audioButton.classList.remove('playing');
                audioButton.querySelector('.icon').textContent = '\u25B6';
            } else {
                audio.play().catch(error => {
                    console.error("Playback failed:", error);
                    alert("Failed to play music. Check if the audio source is available and the file type is supported.");
                    isPlaying = false;
                    audioButtonText.textContent = 'Play Music';
                    audioButton.classList.remove('playing');
                    audioButton.querySelector('.icon').textContent = '\u25B6';
                });
                isPlaying = true;
                audioButtonText.textContent = 'Pause Music';
                audioButton.classList.add('playing');
                audioButton.querySelector('.icon').textContent = '\u23F8';
            }
        });

        audio.addEventListener('ended', () => {
            isPlaying = false;
            audioButtonText.textContent = 'Play Music';
            audioButton.classList.remove('playing');
            audioButton.querySelector('.icon').textContent = '\u25B6';
        });

        yesButton.addEventListener('click', () => {
            window.location.href = "nextpage.html";
        });


    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<title>Animated Flower Tree</title>
<style>
  body {
    margin: 0;
    overflow: hidden;
    background-color: lightblue;
  }

  #tree-container {
    position: relative;
    width: 100vw;
    height: 100vh;
  }

  .branch {
    position: absolute;
    background-color: brown;
    transform-origin: top left;
  }

  .flower {
    position: absolute;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    cursor: pointer;
    transition: transform 0.3s ease, opacity 0.3s ease;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 10px;
  }

  .flower.falling {
    transform: translateY(100vh) rotate(360deg);
    opacity: 0;
    pointer-events: none;
  }

  .flower.text-container {
    position: absolute;
    background-color: white;
    padding: 5px;
    border-radius: 5px;
    display: none;
    pointer-events: none;
    z-index: 10;
  }

</style>
</head>
<body>
<div id="tree-container"></div>

<script>
  const treeContainer = document.getElementById('tree-container');

  function createBranch(x, y, length, angle, thickness, depth) {
    if (depth <= 0) return;

    const branch = document.createElement('div');
    branch.classList.add('branch');
    branch.style.left = `${x}px`;
    branch.style.top = `${y}px`;
    branch.style.width = `${length}px`;
    branch.style.height = `${thickness}px`;
    branch.style.transform = `rotate(${angle}deg)`;

    treeContainer.appendChild(branch);

    const endX = x + length * Math.cos(angle * Math.PI / 180);
    const endY = y + length * Math.sin(angle * Math.PI / 180);

    if (depth === 1) {
      createFlower(endX, endY);
    } else {
      createBranch(endX, endY, length * 0.7, angle + 20 + Math.random() * 20, thickness * 0.8, depth - 1);
      createBranch(endX, endY, length * 0.7, angle - 20 - Math.random() * 20, thickness * 0.8, depth - 1);
    }
  }

  function createFlower(x, y) {
    const flower = document.createElement('div');
    flower.classList.add('flower');
    flower.style.left = `${x - 10}px`;
    flower.style.top = `${y - 10}px`;
    flower.style.backgroundColor = `hsl(${Math.random() * 360}, 100%, 70%)`;

    const textContainer = document.createElement('div');
    textContainer.classList.add('flower.text-container');
    textContainer.textContent = `Flower ${Math.floor(Math.random() * 100)}`;

    flower.appendChild(textContainer);
    treeContainer.appendChild(flower);

    flower.addEventListener('click', () => {
      flower.classList.add('falling');
      textContainer.style.display = 'block';
      textContainer.style.left = `${x}px`;
      textContainer.style.top = `${y - 30}px`;
      setTimeout(() => {
        flower.remove();
      }, 300);
    });
  }

  // Initial tree generation
  createBranch(window.innerWidth / 2, window.innerHeight, 200, -90, 20, 8);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Fireworks</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: sans-serif;
        }

        #fireworks-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        #touch-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 1rem 2rem;
            font-size: 1.5rem;
            color: white;
            background-color: #4299e1;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            box-shadow: 0 0 0.5rem #4299e1;
            transition: background-color 0.3s ease, box-shadow 0 0 0.75rem #3182ce;
            z-index: 10;
        }

        #touch-button:hover {
            background-color: #3182ce;
            box-shadow: 0 0 0.75rem #3182ce;
        }

        #birthday-message-container {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.7);
            padding: 2rem;
            border-radius: 0.5rem;
            text-align: center;
            color: white;
            z-index: 10;
            opacity: 0;
            transition: opacity 1s ease;
            pointer-events: none;
            box-shadow: 0 0 1rem rgba(255, 255, 255, 0.8);
            border: 0.2rem solid white;
        }

        #birthday-message-container h2 {
            font-size: 2rem;
            margin-bottom: 1rem;
            color: #ffdb58;
            text-shadow: 0 0 0.25rem #ffdb58;
        }

        #birthday-message-container p {
            font-size: 1.2rem;
            margin-bottom: 1.5rem;
            color: #fa8bff;
            text-shadow: 0 0 0.25rem #fa8bff;
        }

        .balloon {
            position: absolute;
            width: 3rem;
            height: 4rem;
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            background-color: red;
            opacity: 0;
            bottom: -5rem;
            animation: float 5s infinite, rise 8s ease-in-out forwards;
            z-index: 2;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-1rem); }
        }

        @keyframes rise {
            0% {
                bottom: -5rem;
                opacity: 0;
            }
            10% { opacity: 0.3; }
            100% {
                bottom: calc(100vh + 5rem);
                opacity: 1;
            }
        }

        .balloon:nth-child(2) {
            background-color: #f6d061;
            left: 20%;
            animation-delay: 1s;
        }

        .balloon:nth-child(3) {
            background-color: #a7f3d0;
            left: 40%;
            animation-delay: 2s;
        }

        .balloon:nth-child(4) {
            background-color: #f9a8d4;
            left: 60%;
            animation-delay: 0.5s;
        }

        .balloon:nth-child(5) {
            background-color: #38bdf8;
            left: 80%;
            animation-delay: 1.5s;
        }
        .neon-text {
          color: #fff;
          text-shadow:
            0 0 7px rgba(255, 255, 255, 0.8),
            0 0 10px rgba(255, 255, 255, 0.8),
            0 0 21px rgba(255, 255, 255, 0.8);
        }

        #next-page-button {
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            color: #fff;
            background-color: #f0f;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: background-color 0.3s ease, box-shadow 0.3s ease;
            text-shadow: 0 0 0.5rem #f0f;
            box-shadow: 0 0 0.75rem #f0f;
            margin-top: 26rem;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }

        #next-page-button:hover {
            background-color: #f0f;
            box-shadow: 0 0 0.75rem #f0f;
        }

        #input-container {
            position: absolute;
            top: 30%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 11;
            opacity: 0;
            transition: opacity 1s ease;
            text-align: center;
        }

        #input-container textarea {
            padding: 0.8rem;
            font-size: 1.2rem;
            border: 0.15rem solid #8a2be2;
            border-radius: 0.5rem;
            width: 80%;
            max-width: 400px;
            height: 80px;
            margin-bottom: 1rem;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        #input-container button {
            padding: 0.7rem 1.5rem;
            font-size: 1rem;
            color: #fff;
            background-color: #8a2be2;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: background-color 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 0 0.5rem #9c27b0;
        }

        #input-container button:hover {
            background-color: #9c27b0;
            box-shadow: 0 0 0.75rem #9c27b0;
        }

        #close-button {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            font-size: 1.5rem;
            color: #fff;
            cursor: pointer;
            padding: 0.2rem 0.5rem;
            border-radius: 0.5rem;
            background-color: #f00;
        }

        .text-box-neon {
            color: #fff;
            text-shadow:
              0 0 7px #fff,
              0 0 10px #fff,
              0 0 21px #fff;
        }

    </style>
</head>
<body>
    <canvas id="fireworks-canvas"></canvas>
    <button id="touch-button">Touch Me</button>
    <button id="next-page-button">Next Page</button>
    <div id="birthday-message-container">
        <h2 class="neon-text">Happy Birthday palak 💕</h2>
        <p class="neon-text">Wishing you a fantastic day 💕filled with joy,✨ love, and laughter!</p>
        <p class="neon-text">May all your dreams come true. Happy Birthday🎂!</p>    </div>
    <audio id="birthday-song" src="firework new.mp3" preload="auto"></audio>
    <div class="balloon"></div>
    <div class="balloon"></div>
    <div class="balloon"></div>
    <div class="balloon"></div>
    <div class="balloon"></div>
    <div id="input-container" style="display: none;">
        <textarea id="wish-input" placeholder="Enter your birthday wishes here..." class="text-box-neon"></textarea>
        <button id="submit-wish-button" class="text-box-neon">Submit Wish</button>
        <div id="close-button" class="text-box-neon">x</div>
    </div>

    <script>
        const canvas = document.getElementById('fireworks-canvas');
        const ctx = canvas.getContext('2d');
        const button = document.getElementById('touch-button');
        const nextPageButton = document.getElementById('next-page-button');
        const birthdayMessageContainer = document.getElementById('birthday-message-container');
        const birthdaySong = document.getElementById('birthday-song');
        const wishInputContainer = document.getElementById('input-container');
        const wishInput = document.getElementById('wish-input');
        const submitWishButton = document.getElementById('submit-wish-button');
        const closeButton = document.getElementById('close-button');


        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let fireworks = [];
        let particles = [];
        const gravity = 0.05;
        const explosionSize = 200;
        let isFireworksActive = false;
        let animationFrameId;
        let fireworksIntervalId;
        let fireworksCount = 0;

        function rand(min, max) {
            return Math.random() * (max - min) + min;
        }

        function createFirework(x, y) {
            const color = `hsl(${rand(0, 360)}, 100%, ${rand(60, 100)}%)`;
            const rocket = {
                x: x,
                y: canvas.height,
                destX: x,
                destY: y,
                speed: rand(8, 12),
                color: color,
                radius: 3,
                type: 'rocket',
                trail: [],
                trailLength: 10,
                brightness: 0,
                fadeSpeed: 0.02,
            };
            fireworks.push(rocket);
            fireworksCount++;
        }

        function createExplosion(x, y, color) {
            for (let i = 0; i < explosionSize; i++) {
                const speed = rand(1, 5);
                particles.push({
                    x: x,
                    y: y,
                    color: color,
                    radius: rand(1, 4),
                    speedX: rand(-speed, speed),
                    speedY: rand(-speed, speed),
                    alpha: 1,
                    decay: 0.015,
                    type: 'particle',
                });
            }
        }

        function updateFireworks() {
            for (let i = fireworks.length - 1; i >= 0; i--) {
                const fw = fireworks[i];
                if (fw.type === 'rocket') {
                    fw.y -= fw.speed;
                    const dx = fw.destX - fw.x;
                    const dy = fw.destY - fw.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance < 10) {
                        createExplosion(fw.x, fw.y, fw.color);
                        fireworks.splice(i, 1);
                    } else {
                        fw.trail.push({ x: fw.x, y: fw.y, color: fw.color, alpha: 1 });
                        if (fw.trail.length > fw.trailLength) {
                            fw.trail.shift();
                        }
                    }
                }
                fw.brightness += fw.fadeSpeed;
                if (fw.brightness > 1) fw.brightness = 1;
            }
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.speedX;
                p.y += p.speedY + gravity;
                p.alpha -= p.decay;
                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        function drawFireworks() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            fireworks.forEach(fw => {
                for (let j = 0; j < fw.trail.length; j++) {
                    const point = fw.trail[j];
                    const opacity = j / fw.trail.length;
                    ctx.beginPath();
                    ctx.arc(point.x, point.y, 2, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(${parseInt(fw.color.substring(4, 7))}, ${parseInt(fw.color.substring(9, 12))}, ${parseInt(fw.color.substring(14, 17))}, ${opacity})`;
                    ctx.fill();
                }
                ctx.beginPath();
                const drawColor = fw.color.replace(/hsl\(([\d\.]+), ([\d\.]+%), ([\d\.]+)\)/, `hsl($1, $2, ${parseInt(fw.brightness * 100)}%)`);
                ctx.arc(fw.x, fw.y, fw.radius, 0, Math.PI * 2);
                ctx.fillStyle = drawColor;
                ctx.fill();
            });
            particles.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                const color = p.color.replace(/hsl\(([\d\.]+), ([\d\.]+%), ([\d\.]+)\)/, `hsla($1, $2, $3, ${p.alpha})`);
                ctx.fillStyle = color;
                ctx.fill();
            });
        }

        function animate() {
            if (!isFireworksActive) return;
            updateFireworks();
            updateParticles();
            drawFireworks();
            animationFrameId = requestAnimationFrame(animate);
        }

        function startFireworks() {
            if (!isFireworksActive) {
                isFireworksActive = true;
                animate();
                fireworksIntervalId = setInterval(() => {
                    const x = rand(canvas.width / 10, canvas.width * 9 / 10);
                    const y = rand(canvas.height / 10, canvas.height / 2);
                    createFirework(x, y);
                }, 500);
            }
        }

        button.addEventListener('click', () => {
            startFireworks();
            birthdaySong.play();
            birthdayMessageContainer.style.opacity = 1;
            wishInputContainer.style.opacity = 1;
        });

        nextPageButton.addEventListener('click', () => {
            window.location.href = 'yes.html';
        });

        submitWishButton.addEventListener('click', () => {
            const wishText = wishInput.value;
            if (wishText.trim() !== "") {
                console.log("Wish submitted:", wishText);
                wishInput.value = "";
                wishInputContainer.style.opacity = 0;
            } else {
                alert("Please enter your wish before submitting.");
            }
        });

        closeButton.addEventListener('click', () => {
            wishInputContainer.style.opacity = 0;
            wishInput.style.value = "";
        });

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>

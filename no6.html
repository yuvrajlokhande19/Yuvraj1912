<!DOCTYPE html>
<html>
<head>
<title>Emoji Flower Tree</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  body {
    margin: 0;
    overflow: hidden;
    background-color: lightblue;
    touch-action: manipulation;
    font-family: sans-serif;
  }

  #tree-container {
    position: relative;
    width: 100vw;
    height: 100vh;
  }

  .branch {
    position: absolute;
    background-color: brown;
    transform-origin: top left;
  }

  .flower {
    position: absolute;
    width: 40px;
    height: 40px;
    cursor: pointer;
    transition: transform 0.3s ease, opacity 0.3s ease;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 24px;
  }

  .flower.falling {
    transform: translateY(100vh) rotate(360deg);
    opacity: 0;
    pointer-events: none;
  }

  .leaf {
    position: absolute;
    background-color: lightgreen;
    padding: 10px;
    border-radius: 5px;
    pointer-events: none;
    white-space: nowrap;
  }

  #yes-button {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    padding: 15px 30px;
    background-color: green;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 20px;
    cursor: pointer;
    z-index: 10;
  }

  #small-tree-container {
      position: absolute;
      bottom: 10px;
      left: 10px;
      width: 150px;
      height: 200px;
  }

  #leaf-input-container {
    position: absolute;
    top: 20px;
    left: 20px;
    background-color: rgba(255, 255, 255, 0.8);
    padding: 10px;
    border-radius: 5px;
    z-index: 10;
  }

  #leaf-input {
    padding: 5px;
    border: 1px solid #ccc;
    border-radius: 3px;
  }

  #add-leaf-button {
    padding: 5px 10px;
    background-color: #4CAF50;
    color: white;
    border: none;
    border-radius: 3px;
    cursor: pointer;
  }
</style>
</head>
<body>
<div id="tree-container">
  <button id="yes-button">YES!</button>
  <div id="small-tree-container"></div>
  <div id="leaf-input-container">
    <input type="text" id="leaf-input" placeholder="Enter a sentence">
    <button id="add-leaf-button">Add Leaf</button>
  </div>
</div>

<script>
  const treeContainer = document.getElementById('tree-container');
  const yesButton = document.getElementById('yes-button');
  const smallTreeContainer = document.getElementById("small-tree-container");
  const leafInput = document.getElementById("leaf-input");
  const addLeafButton = document.getElementById("add-leaf-button");

  const emojiFlowers = ['🌸', '🌷', '🌹', '🌻', '🌼', '🌺', '💐', '🥀'];
  const preDefinedSentences = [
    "I love you",
    "I like you",
    "You are pretty",
    "You are amazing",
    "You are wonderful",
    "You are special",
    "You are kind",
    "You are beautiful",
    "You are loved",
    "You are sweet",
    "You are charming",
    "You are the best"
  ];

  function createBranch(x, y, length, angle, thickness, depth, container) {
    if (depth <= 0) return;

    const branch = document.createElement('div');
    branch.classList.add('branch');
    branch.style.left = `${x}px`;
    branch.style.top = `${y}px`;
    branch.style.width = `${length}px`;
    branch.style.height = `${thickness}px`;
    branch.style.transform = `rotate(${angle}deg)`;
    container.appendChild(branch);

    const endX = x + length * Math.cos(angle * Math.PI / 180);
    const endY = y + length * Math.sin(angle * Math.PI / 180);

    if (depth === 1) {
      createFlower(endX, endY, container);
    } else {
      createBranch(endX, endY, length * 0.75, angle + 25 + Math.random() * 25, thickness * 0.9, depth - 1, container);
      createBranch(endX, endY, length * 0.75, angle - 25 - Math.random() * 25, thickness * 0.9, depth - 1, container);
    }
  }

  function createFlower(x, y, container) {
    const flower = document.createElement('div');
    flower.classList.add('flower');
    flower.style.left = `${x - 20}px`;
    flower.style.top = `${y - 20}px`;
    flower.textContent = emojiFlowers[Math.floor(Math.random() * emojiFlowers.length)];
    container.appendChild(flower);

    flower.addEventListener('click', () => {
      flower.classList.add('falling');
      setTimeout(() => {
        flower.remove();
      }, 300);
    });
  }

  function createLeaf(x, y, text) {
    const leaf = document.createElement('div');
    leaf.classList.add('leaf');
    leaf.style.left = `${x}px`;
    leaf.style.top = `${y}px`;
    leaf.textContent = text;
    treeContainer.appendChild(leaf);
  }

  let initialLength = 250;
  let initialThickness = 25;
  if (window.innerWidth < 600) {
    initialLength = 200;
    initialThickness = 20;
  }

  createBranch(window.innerWidth / 2, window.innerHeight, initialLength, -90, initialThickness, 9, treeContainer);
  createBranch(75, 190, 80, -90, 8, 5, smallTreeContainer);

  addLeafButton.addEventListener("click", () => {
    let text = leafInput.value.trim();
    if (!text) {
      text = preDefinedSentences[Math.floor(Math.random() * preDefinedSentences.length)];
    }
    if (text) {
      const x = Math.random() * window.innerWidth;
      const y = Math.random() * window.innerHeight * 0.8;
      createLeaf(x, y, text);
      leafInput.value = "";
    }
  });

  yesButton.addEventListener('click', () => {
    window.location.href = "next_page.html";
  });
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<title>Emoji Flower Tree</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  body {
    margin: 0;
    overflow: hidden;
    background-color: lightblue;
    touch-action: manipulation;
    font-family: sans-serif;
  }

  #tree-container {
    position: relative;
    width: 100vw;
    height: 100vh;
  }

  .branch {
    position: absolute;
    background-color: brown;
    transform-origin: top left;
  }

  .flower {
    position: absolute;
    width: 40px;
    height: 40px;
    cursor: pointer;
    transition: transform 0.3s ease, opacity 0.3s ease;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 24px;
  }

  .flower.falling {
    transform: translateY(100vh) rotate(360deg);
    opacity: 0;
    pointer-events: none;
  }

  .leaf {
    position: absolute;
    background-color: lightgreen;
    padding: 10px;
    border-radius: 5px;
    pointer-events: none;
    white-space: nowrap;
    font-size: 20px;
  }

  #yes-button {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    padding: 15px 30px;
    background-color: green;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 20px;
    cursor: pointer;
    z-index: 10;
  }

  #touch-me-button {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    padding: 20px 40px;
    background-color: #4CAF50;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 24px;
    cursor: pointer;
    z-index: 10;
  }

  .popup {
    position: absolute;
    background-color: white;
    padding: 20px;
    border-radius: 10px;
    font-size: 24px;
    z-index: 11;
    display: none;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
  }
</style>
</head>
<body>
<div id="tree-container">
  <button id="yes-button">YES!</button>
  <button id="touch-me-button">Touch Me</button>
</div>

<script>
  const treeContainer = document.getElementById('tree-container');
  const yesButton = document.getElementById('yes-button');
  const touchMeButton = document.getElementById('touch-me-button');

  const emojiFlowers = ['🌼🌼','🌸', '🌷🪷', '🌹🌼', '🌻', '🌼', '🌺', '💐', '🥀'];
  const preDefinedSentences = [
    "I love you deeply",
    "I adore you",
    "You are incredibly pretty",
    "You are exceptionally amazing",
    "You are wonderfully unique",
    "You are truly special to me",
    "You are remarkably kind",
    "You are breathtakingly beautiful",
    "You are deeply loved by me",
    "You are incredibly sweet and kind",
    "You are charming beyond measure",
    "You are simply the best person I know",
    "You make my heart smile",
    "You brighten my day",
    "You are my sunshine",
    "You are my everything",
    "You are my favorite person",
    "You are the reason I smile",
    "You are my soulmate"
  ];

  function createBranch(x, y, length, angle, thickness, depth, container) {
    if (depth <= 0) return;

    const branch = document.createElement('div');
    branch.classList.add('branch');
    branch.style.left = `${x}px`;
    branch.style.top = `${y}px`;
    branch.style.width = `${length}px`;
    branch.style.height = `${thickness}px`;
    branch.style.transform = `rotate(${angle}deg)`;
    container.appendChild(branch);

    const endX = x + length * Math.cos(angle * Math.PI / 180);
    const endY = y + length * Math.sin(angle * Math.PI / 180);

    if (depth === 1) {
      createFlower(endX, endY, container);
    } else {
      createBranch(endX, endY, length * 0.6, angle + 20 + Math.random() * 20, thickness * 1.1, depth - 1, container);
      createBranch(endX, endY, length * 0.6, angle - 30 - Math.random() * 20, thickness * 1.1, depth - 1, container);
    }
  }

  function createFlower(x, y, container) {
    const flower = document.createElement('div');
    flower.classList.add('flower');
    flower.style.left = `${x - 20}px`;
    flower.style.top = `${y - 20}px`;
    flower.textContent = emojiFlowers[Math.floor(Math.random() * emojiFlowers.length)];
    container.appendChild(flower);

    flower.addEventListener('click', () => {
      flower.classList.add('falling');
      setTimeout(() => {
        flower.remove();
      }, 300);
    });
  }

  function createLeaf(x, y, text) {
    const leaf = document.createElement('div');
    leaf.classList.add('leaf');
    leaf.style.left = `${x}px`;
    leaf.style.top = `${y}px`;
    leaf.textContent = text;
    treeContainer.appendChild(leaf);
  }

  function createPopup(x, y, text){
      const popup = document.createElement('div');
      popup.classList.add('popup');
      popup.textContent = text;
      popup.style.left = `${x}px`;
      popup.style.top = `${y}px`;
      treeContainer.appendChild(popup);
      setTimeout(()=>{
          popup.style.display = 'block';
          setTimeout(()=>{
              popup.remove()
          }, 2000)
      }, 10)
  }

  let initialLength = 150;
  let initialThickness = 30;

  createBranch(window.innerWidth / 2, window.innerHeight * 0.8, initialLength, -90, initialThickness, 6, treeContainer);

  touchMeButton.addEventListener("click", () => {
    const text = preDefinedSentences[Math.floor(Math.random() * preDefinedSentences.length)];
    const x = Math.random() * window.innerWidth * .6 + window.innerWidth * .2;
    const y = Math.random() * window.innerHeight * 0.6 + window.innerHeight * 0.1;
    createPopup(x, y, text);
  });

  yesButton.addEventListener('click', () => {
    window.location.href = "no7.html";
  });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown Timer</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start; /* Align from the top */
            min-height: 100vh; /* Ensure full viewport height */
            margin: 0;
            padding-top: 50px; /* Add some padding at the top */
        }

        #timer {
            font-size: 3em; /* Larger font size for mobile */
            margin-bottom: 20px;
            text-align: center;
            width: 90%; /* Adjust for mobile width */
            max-width: 400px; /* Maximum width */
        }

        #dateInput {
            padding: 10px;
            margin-bottom: 10px;
            width: 80%; /* Adjust for mobile width */
            max-width: 300px;
        }

        #yesButton {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }

        #daysElapsed {
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="timer">Enter a date below</div>

    <input type="date" id="dateInput">

    <button id="yesButton">Yes</button>

    <div id="daysElapsed"></div>

    <script>
        const timerDisplay = document.getElementById('timer');
        const dateInput = document.getElementById('dateInput');
        const yesButton = document.getElementById('yesButton');
        const daysElapsedDisplay = document.getElementById('daysElapsed');

        function updateTimer() {
            const selectedDate = new Date(dateInput.value);
            const now = new Date();

            if (isNaN(selectedDate.getTime())) {
                timerDisplay.textContent = "Enter a date below";
                daysElapsedDisplay.textContent = ""; // Clear elapsed days
                return;
            }

            const timeDifference = selectedDate - now;

            if (timeDifference > 0) {
                const days = Math.floor(timeDifference / (1000 * 60 * 60 * 24));
                const hours = Math.floor((timeDifference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((timeDifference % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((timeDifference % (1000 * 60)) / 1000);

                timerDisplay.textContent = `${days}d ${hours}h ${minutes}m ${seconds}s`;
                daysElapsedDisplay.textContent = ""; // Clear elapsed days
            } else {
                const elapsedDays = Math.floor(Math.abs(timeDifference) / (1000 * 60 * 60 * 24));
                timerDisplay.textContent = "Time elapsed!";
                daysElapsedDisplay.textContent = `Days elapsed: ${elapsedDays}`;
            }
        }

        dateInput.addEventListener('change', () => {
            setInterval(updateTimer, 1000);
            updateTimer(); // Initial update
        });

        yesButton.addEventListener('click', () => {
             if (dateInput.value) {
                window.location.href = "nextpage.html";
            } else{
                alert("Please enter a date first");
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Countdown</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding-top: 50px;
            background-color: #f4f4f4;
            color: #333;
        }

        #timer {
            font-size: 3em;
            margin-bottom: 20px;
            text-align: center;
            width: 90%;
            max-width: 400px;
            font-weight: 700;
        }

        #dateInput {
            padding: 12px;
            margin-bottom: 15px;
            width: 80%;
            max-width: 300px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
            font-family: 'Roboto', sans-serif;
        }

        #yesButton {
            padding: 12px 25px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 700;
        }

        #daysElapsed {
            margin-top: 20px;
            text-align: center;
            font-size: 1.1em;
        }
    </style>
</head>
<body>

    <div id="timer">Enter your birthday below</div>

    <input type="date" id="dateInput">

    <button id="yesButton">Show My Age</button>

    <div id="daysElapsed"></div>

    <script>
        const timerDisplay = document.getElementById('timer');
        const dateInput = document.getElementById('dateInput');
        const yesButton = document.getElementById('yesButton');
        const daysElapsedDisplay = document.getElementById('daysElapsed');

        function calculateAge() {
            const birthDate = new Date(dateInput.value);
            const now = new Date();

            if (isNaN(birthDate.getTime())) {
                alert("Please enter a valid birthday.");
                return;
            }

            const ageInMilliseconds = now - birthDate;
            const ageDate = new Date(ageInMilliseconds);

            const years = Math.abs(ageDate.getUTCFullYear() - 1970);
            const months = ageDate.getUTCMonth();
            const days = Math.floor(ageInMilliseconds / (1000 * 60 * 60 * 24));

            alert(`You are approximately:\n${years} years\n${months} months\n${days} days old.`);
        }

        yesButton.addEventListener('click', () => {
            if (dateInput.value) {
                calculateAge();
            } else {
                alert("Please enter your birthday first.");
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<title>Animated Flower Tree</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  body {
    margin: 0;
    overflow: hidden;
    background-color: lightblue;
    touch-action: manipulation;
  }

  #tree-container {
    position: relative;
    width: 100vw;
    height: 100vh;
  }

  .branch {
    position: absolute;
    background-color: brown;
    transform-origin: top left;
  }

  .flower {
    position: absolute;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    cursor: pointer;
    transition: transform 0.3s ease, opacity 0.3s ease;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 12px;
    background-color: pink;
    text-align: center;
  }

  .flower.falling {
    transform: translateY(100vh) rotate(360deg);
    opacity: 0;
    pointer-events: none;
  }

  .flower.text-container {
    position: absolute;
    background-color: white;
    padding: 5px;
    border-radius: 5px;
    display: none;
    pointer-events: none;
    z-index: 10;
    width: max-content;
  }

  #instruction {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    background-color: rgba(255, 255, 255, 0.8);
    padding: 10px;
    border-radius: 5px;
    z-index: 10;
  }

  #yes-button {
    position: absolute;
    bottom: 20px;
    right: 20px;
    padding: 10px 20px;
    background-color: green;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    z-index: 10;
  }
</style>
</head>
<body>
<div id="tree-container">
  <div id="instruction">Touch the flowers!</div>
  <button id="yes-button">Yes</button>
</div>

<script>
  const treeContainer = document.getElementById('tree-container');
  const yesButton = document.getElementById('yes-button');

  function createBranch(x, y, length, angle, thickness, depth) {
    if (depth <= 0) return;

    const branch = document.createElement('div');
    branch.classList.add('branch');
    branch.style.left = `${x}px`;
    branch.style.top = `${y}px`;
    branch.style.width = `${length}px`;
    branch.style.height = `${thickness}px`;
    branch.style.transform = `rotate(${angle}deg)`;

    treeContainer.appendChild(branch);

    const endX = x + length * Math.cos(angle * Math.PI / 180);
    const endY = y + length * Math.sin(angle * Math.PI / 180);

    if (depth === 1) {
      createFlower(endX, endY);
    } else {
      createBranch(endX, endY, length * 0.75, angle + 25 + Math.random() * 25, thickness * 0.9, depth - 1);
      createBranch(endX, endY, length * 0.75, angle - 25 - Math.random() * 25, thickness * 0.9, depth - 1);
    }
  }

  function createFlower(x, y) {
    const flower = document.createElement('div');
    flower.classList.add('flower');
    flower.style.left = `${x - 20}px`;
    flower.style.top = `${y - 20}px`;

    const textContainer = document.createElement('div');
    textContainer.classList.add('flower.text-container');
    textContainer.textContent = `Word ${Math.floor(Math.random() * 100)}`;

    flower.appendChild(textContainer);
    treeContainer.appendChild(flower);

    flower.addEventListener('click', () => {
      flower.classList.add('falling');
      textContainer.style.display = 'block';
      textContainer.style.left = `${x}px`;
      textContainer.style.top = `${y - 50}px`;
      setTimeout(() => {
        flower.remove();
      }, 300);
    });
  }

  let initialLength = 250;
  let initialThickness = 25;
  if (window.innerWidth < 600) {
    initialLength = 200;
    initialThickness = 20;
  }

  createBranch(window.innerWidth / 2, window.innerHeight, initialLength, -90, initialThickness, 9);

  yesButton.addEventListener('click', () => {
    window.location.href = "next_page.html"; // Replace with your next page URL
  });
</script>
</body>
</html>

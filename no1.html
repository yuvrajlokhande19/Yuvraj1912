<audio id="myAudio" src="Dekho Na Dekho Na _🥀New Hindi Black Screen Status❤️Sad Song Status _Iam__ayaz019(MP3_160K).mp3"></audio>

<button id="playPauseButton" style="font-size: 2em; border: none; background: none; cursor: pointer;">
  ❤️
</button>

<script>
  const audio = document.getElementById("myAudio");
  const playPauseButton = document.getElementById("playPauseButton");
  let isPlaying = false;

  playPauseButton.addEventListener("click", () => {
    if (isPlaying) {
      audio.pause();
      isPlaying = false;
      playPauseButton.textContent = "❤️"; // Heart emoji when paused
    } else {
      audio.play();
      isPlaying = true;
      playPauseButton.textContent = "💕"; // Pause emoji when playing
    }
  });
</script>

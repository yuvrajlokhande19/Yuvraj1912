<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Handwriting</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding-top: 70px; /* Increased padding to accommodate fixed button */
            position: relative; /* Needed for absolute positioning of button */
        }

        #notebookPage {
            background-image: linear-gradient(to bottom, transparent 0%, transparent 8%, #ddd 8%, #ddd 92%, transparent 92%, transparent 100%);
            background-size: 100% 25px;
            width: 90%;
            max-width: 800px;
            min-height: 400px;
            margin-bottom: 80px; /* Increased margin to prevent overlap with fixed button */
            padding: 20px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 10px;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.1);
            font-family: 'Caveat', cursive;
            font-size: 1.2em;
            line-height: 1.5;
            color: #00008b; /* Darker blue for gel pen */
            resize: none;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        #notebookPage:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 5px rgba(0, 123, 255, 0.5);
        }

        .audio-button {
            position: fixed; /* Fix button to top */
            top: 20px;
            left: 50%; /* Center horizontally initially */
            transform: translateX(-50%); /* Precise centering */
            background-color: #fff;
            border: 2px solid #007bff;
            border-radius: 25px; /* Make it round */
            padding: 10px 15px; /* Slightly more horizontal padding */
            padding-left: 30px; /* Make space for the icon */
            padding-right: 30px;
            cursor: pointer;
            font-size: 1em;
            color: #007bff;
            transition: background-color 0.3s ease, color 0.3s ease; /* Smooth transition */
            z-index: 1001; /* Ensure button is above other elements */
            box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
            display: flex; /* Use flexbox for icon alignment */
            align-items: center; /* Vertically center icon and text */
            gap: 8px; /* Space between icon and text */
        }

        .audio-button:hover {
            background-color: #007bff;
            color: white;
        }

        .audio-button.playing {
            background-color: #007bff;
            color: white;
        }

        #yesButton {
            padding: 12px 25px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px; /* Add space above the button */
            font-weight: 700;
            font-size: 1.1em;
            transition: background-color 0.3s ease;
            width: 150px; /* Give it a fixed width */
            text-align: center; /* Center the text */
        }

        #yesButton:hover {
            background-color: #0056b3;
        }

        /* Style for the music note icon */
        .icon {
            width: 20px; /* Fixed size for the icon */
            height: 20px;
            background-size: contain; /* Ensure the whole icon is visible */
            background-repeat: no-repeat;
            display: inline-block; /* Allows setting width and height */
        }

        .play-icon {
            background-image: url('https://unpkg.com/lucide-static@latest/icons/play.svg'); /* Replace with actual play icon URL */
        }

        .pause-icon {
            background-image: url('https://unpkg.com/lucide-static@latest/icons/pause.svg'); /* Replace with actual pause icon URL */
        }


        @media (max-width: 600px) {
            #notebookPage {
                width: 95%;
                max-width: 100%;
                min-height: 300px;
                font-size: 1em;
                padding: 15px;
            }
            .audio-button {
                font-size: 0.9em;
                padding: 8px 25px;
                padding-left: 28px;
            }
            .icon {
                width: 18px;
                height: 18px;
            }
            body {
                padding-top: 60px; /* Adjust top padding for smaller screens */
            }
            #yesButton{
                width: 90%;
                max-width: 300px;
            }
        }
    </style>
</head>
<body>

    <button id="audioButton" class="audio-button">
        <span class="icon play-icon"></span> <span id="audioButtonText">Play Music</span>
    </button>

    <textarea id="notebookPage" placeholder="Start writing here..."></textarea>

    <button id="yesButton">Yes</button>

    <script>
        const notebookPage = document.getElementById('notebookPage');
        const audioButton = document.getElementById('audioButton');
        const audioButtonText = document.getElementById('audioButtonText');
        const yesButton = document.getElementById('yesButton');

        const audio = new Audio('https://www.bensound.com/bensound-music/bensound-happyrock.mp3'); // Replace with your music file URL
        let isPlaying = false;

        // Auto-resize textarea
        notebookPage.addEventListener('input', () => {
            notebookPage.style.height = 'auto';
            notebookPage.style.height = `${notebookPage.scrollHeight}px`;
        });

        window.addEventListener('load', () => {
            notebookPage.style.height = 'auto';
            notebookPage.style.height = `${notebookPage.scrollHeight}px`;
        });

        audioButton.addEventListener('click', () => {
            if (isPlaying) {
                audio.pause();
                isPlaying = false;
                audioButtonText.textContent = 'Play Music';
                audioButton.classList.remove('playing');
                audioButton.querySelector('.icon').classList.remove('pause-icon');
                audioButton.querySelector('.icon').classList.add('play-icon');
            } else {
                audio.play().catch(error => {
                    console.error("Playback failed:", error);
                    alert("Failed to play music.  Check if the audio source is available.");
                    isPlaying = false; // Reset state
                    audioButtonText.textContent = 'Play Music';
                    audioButton.classList.remove('playing');
                    audioButton.querySelector('.icon').classList.remove('pause-icon');
                    audioButton.querySelector('.icon').classList.add('play-icon');
                });
                isPlaying = true;
                audioButtonText.textContent = 'Pause Music';
                audioButton.classList.add('playing');
                audioButton.querySelector('.icon').classList.remove('play-icon');
                audioButton.querySelector('.icon').classList.add('pause-icon');
            }
        });

        audio.addEventListener('ended', () => {
            isPlaying = false;
            audioButtonText.textContent = 'Play Music';
            audioButton.classList.remove('playing');
            audioButton.querySelector('.icon').classList.remove('pause-icon');
            audioButton.querySelector('.icon').classList.add('play-icon');
        });

        yesButton.addEventListener('click', () => {
            window.location.href = "nextpage.html";
        });
    </script>
</body>
</html>

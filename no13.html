<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cherry Blossom Animation</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f8f0fb; /* Light pink background */
            overflow: hidden; /* Prevent scrollbars */
            font-family: 'Caviar Dreams', cursive;
        }

        @font-face {
            font-family: 'Caviar Dreams';
            src: url('https://www.cufonfonts.com/images/character_sets/15075/Caviar_Dreams.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        #page {
            width: 80%;
            height: 80%;
            background-color: rgba(255, 255, 255, 0.8); /* Semi-transparent white */
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-size: 2em;
            color: lightblue; /* Light blue text */
            cursor: pointer;
            transition: transform 0.6s; /* Flip transition */
            transform-style: preserve-3d;
            position: relative; /* Needed for absolute positioning of lines */
        }

        #page.flipped {
            transform: rotateY(180deg);
        }

        #page-front, #page-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden; /* Hide the back of the element */
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
            flex-direction: column; /* For vertical alignment of elements on back */
        }

        #page-front {
            background-color: rgba(255, 255, 255, 0.8); /* Semi-transparent white */
        }

        #page-back {
            background-color: rgba(255, 255, 255, 0.8); /* Semi-transparent white */
            transform: rotateY(180deg); /* Rotate the back side */
            padding-top: 20px;
            padding-bottom: 20px;
            text-align: center; /* Center the text on the back */
        }

        .blossom {
            position: absolute;
            width: 20px; /* Make leaves bigger */
            height: 20px;
            /*background-color: pink;  No background color, use emoji */
            border-radius: 50%;
            pointer-events: none; /* Allows clicks to go through */
            animation: fall 5s linear infinite, drift 3s infinite alternate;
            font-size: 1.5em;  /* Adjust size of emoji */
        }

        @keyframes fall {
            from {
                top: -10%;
            }
            to {
                top: 110%;
            }
        }

        @keyframes drift {
             0% {
                left: 0%;
                transform: rotate(0deg);
            }
            25% {
                left: 25%;
                transform: rotate(20deg);
            }
            50% {
                left: 50%;
                transform: rotate(0deg);
            }
            75% {
                left: 75%;
                transform: rotate(-20deg);
            }
            100% {
                left: 100%;
                transform: rotate(0deg);
            }
        }

        #next-page {
            position: absolute;
            bottom: 20px;
            padding: 10px 20px;
            background-color: #f48fb1; /* Pink button */
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            transition: background-color 0.3s ease;
            font-family: 'Caviar Dreams', cursive;
        }

        #next-page:hover {
            background-color: #e91e63; /* Darker pink on hover */
        }
        .text-wrapper {
            position: relative;
            display: inline-block;
            padding-top: 0.1em;
            padding-right: 0.15em;
            padding-bottom: 0.1em;
            line-height: 1em;
        }
        .letters {
          display: inline-block;
          pointer-events: none;
          cursor: default;
        }

        .page-line {
            position: absolute;
            width: 100%;
            height: 2px;
            background-color: lightgray;
            top: 25%; /* 25% from the top */
        }

        .page-date {
            position: absolute;
            bottom: 10px;
            left: 10px;
            font-size: 0.8em;
            color: #888;
        }

        .page-number {
            position: absolute;
            bottom: 10px;
            right: 10px;
            font-size: 0.8em;
            color: #888;
        }

        .flower {
            position: absolute;
            width: 25px;
            height: 25px;
            font-size: 1.2em;
            pointer-events: none;
            animation: move 4s infinite alternate;
        }

        @keyframes move {
             0% {
                transform: translate(0, 0) rotate(0deg);
            }
            25% {
                transform: translate(10px, -10px) rotate(30deg);
            }
            50% {
                transform: translate(20px, 0px) rotate(0deg);
            }
            75% {
                transform: translate(10px, 10px) rotate(-30deg);
            }
            100% {
                transform: translate(0, 0) rotate(0deg);
            }
        }
        #wishes{
            font-size: 1.2em;
            color: #e91e63;
            font-family: 'Dancing Script', cursive;
            text-align: center;
            margin-bottom: 10px;
        }
        #happy-birthday-heading {
            font-size: 2em;
            color: #f48fb1;
            font-family: 'Caviar Dreams', cursive;
            margin-bottom: 20px;
            text-align: center;
        }

    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script&family=Caviar+Dreams&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
</head>
<body>
    <div id="page" onclick="flipPage()">
        <div id="page-front">Touch Me</div>
        <div id="page-back">
             <div id="happy-birthday-heading">Happy Birthday!</div>
             <div id="wishes">
                May your day be filled with joy,<br>
                And your life with happiness.
             </div>
             <div class="page-line"></div>
             <div class="page-date">23th March 2025</div>
             <div class="page-number">Page 2</div>
        </div>
    </div>
    <audio id="music" src="Jaadui.mp3"></audio>
    <button id="next-page" onclick="location.href='birthday.html'">Next Page</button>

    <script>
        const page = document.getElementById('page');
        const music = document.getElementById('music');
        const body = document.body;
        const flowers = ['🌸', '🌷', '🌹', '🌼', '🌻'];

        function createBlossom() {
            const blossom = document.createElement('div');
            blossom.className = 'blossom';
            blossom.textContent = '🌸'; /* Cherry blossom  emoji */
            blossom.style.left = Math.random() * 100 + '%';
            blossom.style.animationDuration = Math.random() * 4 + 3 + 's';
            blossom.style.animationDelay = Math.random() * 2 + 's';
            body.appendChild(blossom);

            blossom.addEventListener('animationend', () => {
                blossom.remove();
            });
        }

        function createFlower() {
            const flower = document.createElement('div');
            flower.className = 'flower';
            flower.textContent = flowers[Math.floor(Math.random() * flowers.length)];
            flower.style.left = Math.random() * 100 + '%';
            flower.style.top = Math.random() * 100 + '%';
            flower.style.animationDelay = Math.random() * 3 + 's';
            body.appendChild(flower);

            flower.addEventListener('animationend', () => {
                flower.remove();
            });
        }



        function flipPage() {
            page.classList.toggle('flipped');
            music.play();


            // Create multiple blossoms
            for (let i = 0; i < 20; i++) {
                setTimeout(createBlossom, i * 200);
            }
             for (let i = 0; i < 10; i++) {
              setTimeout(createFlower, i * 300);
            }
        }

        // Create initial blossoms
        for (let i = 0; i < 15; i++) {
            setTimeout(createBlossom, i * 300);
        }
         for (let i = 0; i < 10; i++) {
             setTimeout(createFlower, i * 300);
        }
    </script>
</body>
</html>

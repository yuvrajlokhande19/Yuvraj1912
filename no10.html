<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celestial Birthdate Explorer</title>
    <link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js" integrity="sha384-BBtl+eGJRgqQGjJgo6hjy8tq1iG3KmK0ixZqRjFvR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <style>
        body {
            margin: 0;
            background-color: #0c111b;
            font-family: 'Spectral', serif;
            color: #eee;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            width: 95%;
            max-width: 1200px;
            margin-top: 2rem;
            margin-bottom: 2rem;
            padding: 1.5rem;
            background-color: rgba(255, 255, 255, 0.06);
            border-radius: 1rem;
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
        }

        h1, h2 {
            font-family: 'Spectral', serif;
            color: #f5f5f5;
            text-align: center;
            margin-bottom: 1.5rem;
            font-weight: 600;
        }

        h2 {
            font-size: 1.8rem;
            margin-top: 2.5rem;
        }

        #birthdateInput {
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .form-control {
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #eee;
            font-family: 'Inter', sans-serif;
            border-radius: 0.75rem;
            padding: 0.8rem;
        }

        .form-control:focus {
            background-color: rgba(255, 255, 255, 0.2);
            outline: none;
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.3);
        }

        #datePicker {
            width: 100%;
            max-width: 320px;
            margin: 0 auto;
        }

        .btn-primary {
            background-color: #6f2da8;
            border: none;
            color: #fff;
            font-family: 'Inter', sans-serif;
            padding: 0.8rem 1.8rem;
            border-radius: 0.75rem;
            transition: background-color 0.3s ease, transform 0.2s ease;
            font-weight: 500;
            position: relative;
            overflow: hidden;
        }

        .btn-primary:hover {
            background-color: #4e1e7c;
            transform: scale(1.04);
        }

        .btn-primary:active {
            transform: scale(1);
            box-shadow: 0 0.25rem 0.5rem rgba(0, 0, 0, 0.2);
        }

        #moonPhase {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        #moonPhase img {
            width: 150px;
            height: auto;
            border-radius: 50%;
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
            margin-bottom: 1rem;
        }

        #moonPhase img:hover {
            transform: scale(1.1);
        }

        #birthInfo {
            text-align: center;
            margin-bottom: 1.5rem;
            padding: 1.2rem;
            background-color: rgba(255, 255, 255, 0.04);
            border-radius: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.1);
        }

        #birthInfo p {
            font-size: 1.1rem;
            line-height: 1.8;
            color: #eee;
        }

        #astrologyNews {
            margin-bottom: 1.5rem;
        }

        #astrologyNews ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        #astrologyNews li {
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 1.1rem;
            line-height: 1.8;
            color: #eee;
        }

        #astrologyNews li:last-child {
            border-bottom: none;
            padding-bottom: 0;
            margin-bottom: 0;
        }

        #astrologyNews a {
            color: #b4c6ff;
            text-decoration: none;
            transition: color 0.2s ease;
            font-weight: 500;
        }

        #astrologyNews a:hover {
            color: #d0e1ff;
        }

        .card {
            background-color: rgba(255, 255, 255, 0.04);
            border-radius: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.1);
        }

        .card-body {
            padding: 1.5rem;
        }

        .card-title {
            font-size: 1.4rem;
            color: #f5f5f5;
            margin-bottom: 1rem;
            font-weight: 600;
        }

        .card-text {
            font-size: 1.1rem;
            line-height: 1.8;
            color: #eee;
        }

        @media (max-width: 768px) {
            .container {
                width: 98%;
                padding: 1rem;
            }

            h1 {
                font-size: 2rem;
            }

            h2 {
                font-size: 1.6rem;
            }

            #moonPhase img {
                width: 120px;
            }

            #datePicker {
                max-width: 100%;
            }
        }

        @media (max-width: 576px) {
            h1 {
                font-size: 1.75rem;
            }

            h2 {
                font-size: 1.4rem;
            }

            .card-title {
                font-size: 1.2rem;
            }

            .card-text {
                font-size: 1rem;
            }
        }

        .next-page-button {
            margin-top: 2rem;
            text-align: center;
        }

        .next-page-button a {
            background-color: #6f2da8;
            border: none;
            color: #fff;
            font-family: 'Inter', sans-serif;
            padding: 0.8rem 1.8rem;
            border-radius: 0.75rem;
            transition: background-color 0.3s ease, transform 0.2s ease;
            font-weight: 500;
            text-decoration: none;
            display: inline-block;
            position: relative;
            overflow: hidden;
        }

        .next-page-button a:hover {
            background-color: #4e1e7c;
            transform: scale(1.04);
        }

        .next-page-button a:active {
            transform: scale(1);
            box-shadow: 0 0.25rem 0.5rem rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Celestial Birthdate Explorer</h1>

        <div id="birthdateInput">
            <label for="datePicker" class="form-label">Select Your Birthdate:</label>
            <input type="date" id="datePicker" class="form-control">
            <button id="submitButton" class="btn btn-primary mt-3">Explore the Cosmos</button>
        </div>

        <div id="moonPhase" class="text-center">
            <h2>Your Moon Phase</h2>
            <img id="moonImage" src="" alt="Moon Phase">
            <p id="moonPhaseName" class="mt-2"></p>
        </div>

        <div id="birthInfo" class="text-center">
            <h2>Information about Your Birthdate</h2>
            <p id="dayOfWeek"></p>
            <p id="zodiacSign"></p>
            <p id="birthStone"></p>
            <p id="birthFlower"></p>
        </div>

        <div id="astrologyNews">
            <h2>Astrology News</h2>
            <ul id="newsList" class="list-group">
            </ul>
        </div>
        <div class="card">
            <div class="card-body">
                <h2 class="card-title">About this App</h2>
                <p class="card-text">
                    This web application allows you to discover the celestial conditions on your birthdate.  Enter your birthdate to see the phase of the moon, and  astrology news.
                </p>
            </div>
        </div>
        <div class="next-page-button">
            <a href="no11.html">next page</a>
        </div>
    </div>

    <script>
        const datePicker = document.getElementById("datePicker");
        const submitButton = document.getElementById("submitButton");
        const moonImage = document.getElementById("moonImage");
        const moonPhaseName = document.getElementById("moonPhaseName");
        const  dayOfWeekDisplay = document.getElementById("dayOfWeek");
        const zodiacSignDisplay = document.getElementById("zodiacSign");
        const birthStoneDisplay = document.getElementById("birthStone");
        const birthFlowerDisplay = document.getElementById("birthFlower");
        const newsList = document.getElementById("newsList");
        const body = document.querySelector("body");

        // --- Background Music (Tone.js) ---
        const music = new Audio('agar tum kaho new.mp3'); // Replace with your music file
        music.loop = true;
        let musicPlaying = false;

        const moonPhases = [
            { name: "New Moon", imageUrl: "https://moon-watch.com/images/moon-phases/new-moon.png" },
            { name: "Waxing Crescent", imageUrl: "https://moon-watch.com/images/moon-phases/waxing-crescent.png" },
            { name: "First Quarter", imageUrl: "https://moon-watch.com/images/moon-phases/first-quarter.png" },
            { name: "Waxing Gibbous", imageUrl: "https://moon-watch.com/images/moon-phases/waxing-gibbous.png" },
            { name: "Full Moon", imageUrl: "https://moon-watch.com/images/moon-phases/full-moon.png" },
            { name: "Waning Gibbous", imageUrl: "https://moon-watch.com/images/moon-phases/waning-gibbous.png" },
            { name: "Last Quarter", imageUrl: "https://moon-watch.com/images/moon-phases/last-quarter.png" },
            { name: "Waning Crescent", imageUrl: "https://moon-watch.com/images/moon-phases/waning-crescent.png" },
        ];

        // Simplified Moon Phase Calculation
        function getMoonPhase(date) {
            const dayOfYear = (date - new Date(date.getFullYear(), 0, 0)) / 1000 / 60 / 60 / 24;
            const phase = Math.floor((dayOfYear % 29.53) / 3.7);
            return moonPhases[phase] || moonPhases[0];
        }



        // Function to fetch astrology news
        async function getAstrologyNews() {
            const apiUrl = `https://www.astrology.com/us/editorial/rss/daily-horoscope.xml`;

            try {
                const response = await fetch(apiUrl);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const text = await response.text();
                const xmlDoc = new DOMParser().parseFromString(text, "text/xml");
                const items = xmlDoc.querySelectorAll("item");

                newsList.innerHTML = "";
                items.forEach(item => {
                    const title = item.querySelector("title").textContent;
                    const link = item.querySelector("link").textContent;
                    const pubDate = item.querySelector("pubDate").textContent;

                    const listItem = document.createElement("li");
                    listItem.innerHTML = `<a href="${link}" target="_blank">${title}</a><br><span class="text-muted">${pubDate}</span>`;
                    newsList.appendChild(listItem);
                });
            } catch (error) {
                console.error("Error fetching astrology news:", error);
                newsList.innerHTML = "<li>News unavailable.</li>";
            }
        }

        function getDayOfWeek(date) {
            const days = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
            return days[date.getDay()];
        }

        function getZodiacSign(date) {
            const day = date.getDate();
            const month = date.getMonth() + 1;
            if ((month === 3 && day >= 21) || (month === 4 && day <= 19)) return "Aries";
            if ((month === 4 && day >= 20) || (month === 5 && day <= 20)) return "Taurus";
            if ((month === 5 && day >= 21) || (month === 6 && day <= 20)) return "Gemini";
            if ((month === 6 && day >= 21) || (month === 7 && day <= 22)) return "Cancer";
            if ((month === 7 && day >= 23) || (month === 8 && day <= 22)) return "Leo";
            if ((month === 8 && day >= 23) || (month === 9 && day <= 22)) return "Virgo";
            if ((month === 9 && day >= 23) || (month === 10 && day <= 22)) return "Libra";
            if ((month === 10 && day >= 23) || (month === 11 && day <= 21)) return "Scorpio";
            if ((month === 11 && day >= 22) || (month === 12 && day <= 21)) return "Sagittarius";
            if ((month === 12 && day >= 22) || (month === 1 && day <= 19)) return "Capricorn";
            if ((month === 1 && day >= 20) || (month === 2 && day <= 18)) return "Aquarius";
            return "Pisces";
        }

        function getBirthStone(month) {
            const stones = ["Garnet", "Amethyst", "Aquamarine", "Diamond", "Emerald", "Pearl",
                            "Ruby", "Peridot", "Sapphire", "Opal", "Topaz", "Tanzanite"];
            return stones[month];
        }

        function getBirthFlower(month) {
            const flowers = ["Carnation", "Violet", "Daffodil", "Daisy", "Lily of the Valley", "Rose",
                             "Water Lily", "Gladiolus", "Aster", "Marigold", "Chrysanthemum", "Poinsettia"];
            return flowers[month];
        }

        submitButton.addEventListener("click", () => {
            const selectedDate = new Date(datePicker.value);
            if (isNaN(selectedDate.getTime())) {
                alert("Please select a valid date.");
                return;
            }

            // --- Play Music on Button Click ---
            if (!musicPlaying) {
                music.play().then(() => {
                    musicPlaying = true;
                }).catch(error => {
                    console.error("Playback prevented:", error);
                });
            }

            const moonPhase = getMoonPhase(selectedDate);
            moonImage.src = moonPhase.imageUrl;
            moonPhaseName.textContent = moonPhase.name;

            const dayOfWeek = getDayOfWeek(selectedDate);
            const zodiacSign = getZodiacSign(selectedDate);
            const birthStone = getBirthStone(selectedDate.getMonth());
            const birthFlower = getBirthFlower(selectedDate.getMonth());

            dayOfWeekDisplay.textContent = `Day of the Week: ${dayOfWeek}`;
            zodiacSignDisplay.textContent = `Zodiac Sign: ${zodiacSign}`;
            birthStoneDisplay.textContent = `Birth Stone: ${birthStone}`;
            birthFlowerDisplay.textContent = `Birth Flower: ${birthFlower}`;


            getAstrologyNews();
        });

        // Initial news load
        getAstrologyNews();
    </script>
</body>
</html>

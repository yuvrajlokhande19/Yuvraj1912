<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Handwriting poem</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #e6e6fa; /* Light purple lavender */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding-top: 70px;
            position: relative;
        }

        #notebookPage {
            background-image: linear-gradient(to bottom, transparent 0%, transparent 8%, #d3d3d3 8%, #d3d3d3 92%, transparent 92%, transparent 100%); /* Lighter lines for lavender */
            background-size: 100% 25px;
            width: 90%;
            max-width: 800px;
            min-height: 400px;
            margin-bottom: 80px;
            padding: 20px;
            box-sizing: border-box;
            border: 1px solid #ccc; /* Lighter border */
            border-radius: 10px;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.1);
            font-family: 'Caveat', cursive;
            font-size: 1.2em;
            line-height: 1.5;
            color: #00008b;
            resize: none;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            pointer-events: none;
        }

        #notebookPage:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 5px rgba(0, 123, 255, 0.5);
        }

        .audio-button {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #fff;
            border: 2px solid #007bff;
            border-radius: 25px;
            padding: 15px; /* Increased padding to make the button bigger*/
            cursor: pointer;
            font-size: 1.5em; /* Increased font size for the emoji */
            color: #007bff;
            transition: background-color 0.3s ease, color 0.3s ease;
            z-index: 1001;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: center; /* Center the emoji */
            width: 50px; /* Give it a fixed width */
            height: 50px; /* Give it a fixed height */
            text-align: center; /* center the content */
            overflow: hidden;  /* hide extra padding */
        }

        .audio-button:hover {
            background-color: #007bff;
            color: white;
        }

        .audio-button.playing {
            background-color: #007bff;
            color: white;
        }

        #yesButton {
            padding: 12px 25px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            font-weight: 700;
            font-size: 1.1em;
            transition: background-color 0.3s ease;
            width: 150px;
            text-align: center;
        }

        #yesButton:hover {
            background-color: #0056b3;
        }

        .icon {
            width: 20px;
            height: 20px;
            background-size: contain;
            background-repeat: no-repeat;
            display: inline-block;
        }

        .play-icon {
           /* background-image: url('https://unpkg.com/lucide-static@latest/icons/play.svg'); */ /* Removed image, using text now */
        }

        .pause-icon {
            /* background-image: url('https://unpkg.com/lucide-static@latest/icons/pause.svg'); */
        }

        #musicFile {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1002;
            opacity: 0;
            cursor: pointer;
            width: 200px;
            height: 50px;
        }

        @media (max-width: 600px) {
            #notebookPage {
                width: 95%;
                max-width: 100%;
                min-height: 300px;
                font-size: 1em;
                padding: 15px;
            }
            .audio-button {
                font-size: 1.2em; /* Keep the emoji size the same on small screens */
                padding: 12px;  /* Adjust padding as necessary */
                width: 45px;
                height: 45px;

            }
            .icon {
                width: 18px;
                height: 18px;
            }
            body {
                padding-top: 60px;
            }
            #yesButton{
                width: 90%;
                max-width: 300px;
            }
            
        }
    </style>
</head>
<body>

    <textarea id="notebookPage"> This poem is written so beautifully

How Can You "SM LE" Without "|"?

How Can You Be "F_ NE" Without "l"?

How Can You "W SH" Without "I"?

How Can You Be "N CE" Without "|"?

How Can You Be a"FR_END" VWithout "|"? So "I" Am Very Important!

But How Can I Achieve "S CCESS" Without "U"? How Can "LA GH" Without 'U?

How Can I Take A "C P" of Tea Without "U"?

How Can I Enjoy The "S NSHINE" Without "U" How Can I Have "FN" Without "U"?

And That Makes "U" More Important Than ""Therefore humans (U & I) =

WE need one another in life to be happy
</textarea>

    <button id="yesButton">Yes</button>

    <script>
        const notebookPage = document.getElementById('notebookPage');
        const audioButton = document.getElementById('audioButton');
        const yesButton = document.getElementById('yesButton');
        const musicFile = document.getElementById('musicFile');
        const pressMeButton = document.getElementById('pressMeButton');

        let audio = new Audio('kabhi-kabhi.mp3'); // Add your music file path here
        let isPlaying = false;


        window.addEventListener('load', () => {
            notebookPage.style.height = 'auto';
            notebookPage.style.height = `${notebookPage.scrollHeight}px`;
        });

        audioButton.addEventListener('click', () => {
            if (isPlaying) {
                audio.pause();
                isPlaying = false;
                audioButton.classList.remove('playing');
                audioButton.textContent = '\u25B6';
            } else {
                audio.play().catch(error => {
                    console.error("Playback failed:", error);
                    alert("Failed to play music. Check if the audio source is available and the file type is supported.");
                    isPlaying = false;
                    audioButton.classList.remove('playing');
                    audioButton.textContent = '\u25B6';
                });
                isPlaying = true;
                audioButton.classList.add('playing');
                audioButton.textContent = '\u23F8';
            }
        });

        audio.addEventListener('ended', () => {
            isPlaying = false;
            audioButton.textContent = '\u25B6';
            audioButton.classList.remove('playing');
        });

        yesButton.addEventListener('click', () => {
            window.location.href = "no9.html";
        });

        musicFile.addEventListener('change', (event) => {
            const file = event.target.files[0];
            const url = URL.createObjectURL(file);
            audio.src = url;
            audioButton.textContent = '\u25B6';
            isPlaying = false;
            audioButton.classList.remove('playing');
        });

    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<title>Enchanting Wire Tree</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  body {
    margin: 0;
    overflow: hidden;
    background: linear-gradient(to bottom, #ffe0f0, #ffb6c1);
    touch-action: manipulation;
    font-family: 'Georgia', serif;
  }

  #tree-container {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-end;
  }

  .branch {
    position: absolute;
    border-radius: 50%;
    background: linear-gradient(to bottom, #8B4513, #A0522D);
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
  }

  .flower {
    position: absolute;
    width: 30px;
    height: 30px;
    cursor: pointer;
    transition: transform 0.3s ease, opacity 0.3s ease;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 20px;
    background: rgba(255, 255, 255, 0.85);
    border-radius: 50%;
    box-shadow: 0 3px 6px rgba(0, 0, 0, 0.2);
  }

  .flower.falling {
    transform: translateY(100vh) rotate(360deg);
    opacity: 0;
    pointer-events: none;
  }

  .popup {
    position: absolute;
    background: rgba(255, 255, 255, 0.95);
    padding: 18px;
    border-radius: 10px;
    font-size: 20px;
    z-index: 11;
    display: none;
    box-shadow: 0 5px 10px rgba(0, 0, 0, 0.35);
  }

  #yes-button {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    padding: 14px 28px;
    background: linear-gradient(to bottom, #3CB371, #2E8B57);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 20px;
    cursor: pointer;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
    z-index: 10;
  }

  #touch-me-button {
    position: absolute;
    top: 80px;
    left: 50%;
    transform: translateX(-50%);
    padding: 20px 40px;
    background: linear-gradient(to bottom, #4682B4, #4169E1);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 22px;
    cursor: pointer;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
    z-index: 10;
  }

  #instruction {
    position: absolute;
    top: 140px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255, 255, 255, 0.9);
    padding: 12px;
    border-radius: 8px;
    font-size: 18px;
    z-index: 10;
    box-shadow: 0 3px 6px rgba(0, 0, 0, 0.25);
  }
</style>
</head>
<body>
<div id="tree-container">
  <button id="yes-button">YES!</button>
  <button id="touch-me-button">Touch Me</button>
  <div id="instruction">Touch the flowers!</div>
</div>

  function createBranch(x, y, length, angle, thickness, depth) {
    if (depth <= 0) return;

    const branch = document.createElement('div');
    branch.classList.add('branch');
    branch.style.left = `${x - thickness / 2}px`;
    branch.style.top = `${y}px`;
    branch.style.width = `${thickness}px`;
    branch.style.height = `${length}px`;
    branch.style.transform = `rotate(${angle}deg)`;

    treeContainer.appendChild(branch);

    const endX = x + length * Math.cos(angle * Math.PI / 180);
    const endY = y + length * Math.sin(angle * Math.PI / 180);

    if (depth === 1) {
      for (let i = 0; i < 6; i++) {
        createFlower(endX + Math.random() * 25 - 12.5, endY + Math.random() * 25 - 12.5);
      }
    } else {
      createBranch(endX, endY, length * 0.65, angle + 22 + Math.random() * 12, thickness * 0.75, depth - 1);
      createBranch(endX, endY, length * 0.65, angle - 22 - Math.random() * 12, thickness * 0.75, depth - 1);
    }
  }

  function createFlower(x, y) {
    const flower = document.createElement('div');
    flower.classList.add('flower');
    flower.style.left = `${x - 15}px`;
    flower.style.top = `${y - 15}px`;
    flower.textContent = emojiFlowers[Math.floor(Math.random() * emojiFlowers.length)];
    treeContainer.appendChild(flower);

    flower.addEventListener('click', () => {
      flower.classList.add('falling');
      setTimeout(() => {
        flower.remove();
      }, 300);
    });
  }

  function createPopup(x, y, text) {
    const popup = document.createElement('div');
    popup.classList.add('popup');
    popup.textContent = text;
    popup.style.left = `${x}px`;
    popup.style.top = `${y}px`;
    treeContainer.appendChild(popup);
    popup.style.display = 'block';
    setTimeout(() => {
      popup.remove();
    }, 2000);
  }
